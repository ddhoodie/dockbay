{% extends "registry/base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
  <h1>{{ heading }}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{{ submit_label }}</button>
  </form>
{% endblock %}
