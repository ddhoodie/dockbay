{% extends "registry/base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
  <h1>Register</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>
  <p><a href="{% url 'login' %}">Already have an account? Log in.</a></p>
{% endblock %}
