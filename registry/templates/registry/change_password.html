{% extends "registry/base.html" %}

{% block title %}Change password{% endblock %}

{% block content %}
  <h1>Change password</h1>
  <p>You must change the initial password before entering the app.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save password</button>
  </form>
{% endblock %}
