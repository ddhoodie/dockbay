{% extends "registry/base.html" %}

{% block title %}{{ repository.full_name }}{% endblock %}

{% block content %}
  <h1>{{ repository.full_name }}</h1>
  <p>{{ repository.description }}</p>
  <p>Visibility: {{ repository.visibility }}</p>
  {% if repository.owner_id == user.id %}
    <p><a href="{% url 'repository_settings' repository.owner.username repository.name %}">Settings</a></p>
    <p><a href="{% url 'repository_delete' repository.owner.username repository.name %}">Delete</a></p>
  {% endif %}
{% endblock %}
